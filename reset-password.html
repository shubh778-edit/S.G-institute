<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | S.G Institute</title>  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    :root {
      --gold: #d4af37;
      --gold-light: #f5d76e;
      --bg: #080808;
      --card: #111111;
      --text: #f5f5f5;
      --muted: #a5a5a5;
      --border: #292929;
      --error: #ff6b6b;
      --success: #5de0a0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 22px;
      background:
        radial-gradient(circle at top, #30250b 0%, transparent 35%),
        var(--bg);
      color: var(--text);
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 36px 30px;
      background: var(--card);
      border: 1px solid #453819;
      border-radius: 18px;
      box-shadow: 0 20px 60px #0009;
    }

    .logo {
      width: 66px;
      height: 66px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--gold);
      border-radius: 50%;
      color: var(--gold);
      font-size: 23px;
      font-weight: 800;
    }

    h1 {
      text-align: center;
      font-size: 25px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: var(--muted);
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin: 17px 0 8px;
      font-size: 13px;
      color: #e7e7e7;
    }

    input {
      width: 100%;
      padding: 14px;
      background: #090909;
      border: 1px solid var(--border);
      border-radius: 9px;
      color: white;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 2px #d4af3720;
    }

    .btn {
      width: 100%;
      margin-top: 23px;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: var(--gold);
      color: #111;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn:hover {
      background: var(--gold-light);
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.6;
      margin-top: 18px;
      overflow-wrap: anywhere;
    }

    .message.error {
      display: block;
      color: var(--error);
      background: #ff6b6b12;
      border: 1px solid #ff6b6b40;
    }

    .message.success {
      display: block;
      color: var(--success);
      background: #5de0a012;
      border: 1px solid #5de0a040;
    }

    .footer {
      margin-top: 25px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }

    a {
      color: var(--gold);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 480px) {
      .card {
        padding: 30px 22px;
      }

      h1 {
        font-size: 22px;
      }
    }
  </style></head><body>  <main class="card">
    <div class="logo">SG</div><h1>Create New Password</h1>

<p class="subtitle">
  Choose a strong new password for your
  S.G Institute of Learning account.
</p>

<div id="loadingMessage" class="message">
  Verifying your password-reset link...
</div>

<form id="resetForm" class="hidden">
  <label for="password">New Password</label>
  <input
    type="password"
    id="password"
    placeholder="Enter new password"
    minlength="8"
    autocomplete="new-password"
    required
  >

  <label for="confirmPassword">Confirm New Password</label>
  <input
    type="password"
    id="confirmPassword"
    placeholder="Re-enter new password"
    minlength="8"
    autocomplete="new-password"
    required
  >

  <button type="submit" class="btn" id="submitBtn">
    Update Password
  </button>
</form>

<div id="message" class="message" role="status" aria-live="polite"></div>

<div class="footer">
  Remembered your password?
  <a href="login.html">Back to Login</a>
</div>

  </main>  <script>
    const SUPABASE_URL =
      "https://ywsedmdfacwgvskkiuzy.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_LSM3kXWUKw9K7OEroiabkw_zVTdAoEM";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const resetForm = document.getElementById("resetForm");
    const loadingMessage = document.getElementById("loadingMessage");
    const messageBox = document.getElementById("message");
    const submitBtn = document.getElementById("submitBtn");

    let linkVerified = false;

    function showMessage(text, type) {
      messageBox.textContent = text;
      messageBox.className = "message " + type;
    }

    function showLoading(text) {
      loadingMessage.textContent = text;
      loadingMessage.className = "message";
      loadingMessage.style.display = "block";
    }

    function hideLoading() {
      loadingMessage.style.display = "none";
    }

    async function initializePage() {
      showLoading("Verifying your password-reset link...");

      try {
        // Supabase may return the recovery session in the URL hash.
        // The SDK handles the recovery callback when configured correctly.
        const { data, error } = await db.auth.getSession();

        if (error) {
          throw error;
        }

        if (data.session) {
          linkVerified = true;
          resetForm.classList.remove("hidden");
          hideLoading();
          return;
        }

        hideLoading();

        showMessage(
          "This reset link is invalid, expired, or has already been used. Please request a new password-reset email.",
          "error"
        );
      } catch (error) {
        hideLoading();

        showMessage(
          error.message || "Unable to verify this link. Please request a new one.",
          "error"
        );
      }
    }

    resetForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      if (!linkVerified) {
        showMessage(
          "Your reset link has not been verified. Please request a new link.",
          "error"
        );
        return;
      }

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password.length < 8) {
        showMessage(
          "Your password must contain at least 8 characters.",
          "error"
        );
        return;
      }

      if (password !== confirmPassword) {
        showMessage(
          "The passwords do not match. Please try again.",
          "error"
        );
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Updating Password...";

      try {
        const { error } = await db.auth.updateUser({
          password: password
        });

        if (error) {
          throw error;
        }

        resetForm.classList.add("hidden");

        showMessage(
          "Your password has been updated successfully. You can now log in with your new password.",
          "success"
        );

        // End the recovery session after the password is changed.
        await db.auth.signOut();

        const loginLink = document.createElement("p");
        loginLink.style.marginTop = "14px";
        loginLink.style.textAlign = "center";

        const link = document.createElement("a");
        link.href = "login.html";
        link.textContent = "Go to Login";

        loginLink.appendChild(link);
        messageBox.appendChild(loginLink);

      } catch (error) {
        showMessage(
          error.message || "Password could not be updated. Please try again.",
          "error"
        );
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Update Password";
      }
    });

    initializePage();
  </script></body>
</html>
