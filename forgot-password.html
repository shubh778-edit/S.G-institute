<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>S.G Institute | Forgot Password</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#090909;--panel:#141414;--gold:#d4af37;--text:#f5f5f5;--muted:#aaa;--border:#292929}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
.card{width:100%;max-width:430px;background:var(--panel);border:1px solid #403517;border-radius:17px;padding:32px;box-shadow:0 20px 70px #0008}
.brand{text-align:center;color:var(--gold);font-weight:bold;font-size:22px;letter-spacing:.5px}
.sub-brand{text-align:center;color:var(--muted);font-size:11px;margin-top:7px}
h1{font-size:25px;margin:30px 0 10px}
.description{font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:23px}
label{display:block;font-size:12px;color:#ddd;margin-bottom:8px}
input{width:100%;padding:13px;background:#0c0c0c;border:1px solid #383838;border-radius:8px;color:#fff;font-size:14px;outline:none}
input:focus{border-color:var(--gold)}
button{width:100%;padding:14px;border:0;border-radius:8px;background:var(--gold);color:#111;font-weight:bold;cursor:pointer;margin-top:17px}
button:disabled{opacity:.6;cursor:not-allowed}
.message{display:none;margin-top:17px;padding:12px;border-radius:8px;font-size:12px;line-height:1.7;overflow-wrap:anywhere}
.message.success{display:block;background:#123022;color:#8ce5b9}
.message.error{display:block;background:#3b1717;color:#ffaaaa}
.links{text-align:center;margin-top:22px;font-size:12px;line-height:2}
a{color:var(--gold);text-decoration:none}
a:hover{text-decoration:underline}
.footer{text-align:center;color:#777;font-size:11px;margin-top:25px}
</style>
</head>
<body>
<main class="card">
 <div class="brand">S.G INSTITUTE</div>
 <div class="sub-brand">OF LEARNING</div>

 <h1>Forgot Password?</h1>
 <p class="description">
  Enter your registered email address. If password recovery is available for your account, Supabase will send you instructions to reset your password.
 </p>

 <form id="resetForm">
  <label for="email">Registered Email Address</label>
  <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required>
  <button id="submitBtn" type="submit">Send Reset Link</button>
 </form>

 <div id="message" class="message" role="status" aria-live="polite"></div>

 <div class="links">
  <a href="login.html">← Back to Login</a><br>
  <a href="index.html">Return to Home</a>
 </div>

 <div class="footer">© S.G Institute of Learning</div>
</main>

<script>
const SUPABASE_URL="https://jpiqbjitnizixxqgrtzn.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_o2SaJmznZmD7_8UAzcj58w_xZZjjHBH";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

const form=document.getElementById("resetForm");
const emailInput=document.getElementById("email");
const button=document.getElementById("submitBtn");
const message=document.getElementById("message");

form.addEventListener("submit",async event=>{
 event.preventDefault();
 message.className="message";
 message.textContent="";

 if(SUPABASE_ANON_KEY.includes("PASTE_YOUR")){
  message.className="message error";
  message.textContent="Please configure your Supabase publishable/anon key first.";
  return;
 }

 const email=emailInput.value.trim();
 if(!email)return;

 button.disabled=true;
 button.textContent="Sending...";

 try{
  const {error}=await db.auth.resetPasswordForEmail(email,{
   redirectTo:location.origin+location.pathname.replace(/[^/]*$/,"")+"reset-password.html"
  });

  if(error)throw error;

  message.className="message success";
  message.textContent="If an account with this email can be recovered, a password-reset email will be sent. Check your inbox and spam folder.";
 }catch(error){
  message.className="message error";
  message.textContent="Unable to request a reset link: "+error.message;
 }finally{
  button.disabled=false;
  button.textContent="Send Reset Link";
 }
});
</script>
</body>
</html>
