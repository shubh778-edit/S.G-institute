<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S.G Institute of Learning</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #071426;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: #10233c;
      border: 1px solid #c9a44c;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 10px 35px #0005;
    }

    h1 {
      color: #e7c66e;
      text-align: center;
      font-size: 25px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #cbd5e1;
      margin-bottom: 24px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-weight: bold;
    }

    .tab {
      flex: 1;
      background: #203853;
      color: white;
    }

    .tab.active {
      background: #d6b45d;
      color: #071426;
    }

    label {
      display: block;
      margin: 13px 0 7px;
      color: #f1d98f;
      font-size: 14px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #526780;
      border-radius: 8px;
      background: #071426;
      color: white;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #e7c66e;
    }

    .submit {
      width: 100%;
      margin-top: 22px;
      background: #d6b45d;
      color: #071426;
      font-size: 16px;
    }

    .message {
      margin-top: 16px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .hidden {
      display: none;
    }

    .welcome {
      text-align: center;
    }

    .welcome p {
      margin: 15px 0;
      line-height: 1.6;
    }

    .logout {
      background: #d6b45d;
      color: #071426;
      width: 100%;
      margin-top: 20px;
    }

    .brand {
      text-align: center;
      font-size: 12px;
      color: #aebed0;
      margin-top: 22px;
    }
  </style>
</head>

<body>
  <main class="container">
    <section id="authSection">
      <h1>S.G INSTITUTE</h1>
      <p class="subtitle">OF LEARNING</p>

      <div class="tabs">
        <button class="tab active" id="loginTab" type="button">
          Student Login
        </button>
        <button class="tab" id="registerTab" type="button">
          Register
        </button>
      </div>

      <form id="loginForm">
        <label for="loginEmail">Email Address</label>
        <input id="loginEmail" type="email" autocomplete="email"
               placeholder="Enter your email" required>

        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password"
               autocomplete="current-password"
               placeholder="Enter password" required>

        <button class="submit" type="submit">LOGIN</button>
      </form>

      <form id="registerForm" class="hidden">
        <label for="fullName">Full Name</label>
        <input id="fullName" type="text" autocomplete="name"
               placeholder="Enter full name" required>

        <label for="registerEmail">Email Address</label>
        <input id="registerEmail" type="email" autocomplete="email"
               placeholder="Enter a valid email" required>

        <label for="course">Select Course</label>
        <select id="course" required>
          <option value="">Choose your course</option>
          <option value="B.B.A">B.B.A</option>
          <option value="B.C.A">B.C.A</option>
          <option value="B.COM">B.COM</option>
          <option value="B.A">B.A</option>
          <option value="COMPUTER SCIENCE (GSET)">
            COMPUTER SCIENCE (GSET)
          </option>
        </select>

        <label for="registerPassword">Create Password</label>
        <input id="registerPassword" type="password"
               autocomplete="new-password"
               minlength="8" placeholder="Minimum 8 characters" required>

        <label for="confirmPassword">Confirm Password</label>
        <input id="confirmPassword" type="password"
               autocomplete="new-password"
               minlength="8" placeholder="Re-enter password" required>

        <button class="submit" type="submit">CREATE ACCOUNT</button>
      </form>

      <p id="message" class="message" role="status" aria-live="polite"></p>

      <p class="brand">S.G Institute of Learning · Student Portal</p>
    </section>

    <section id="dashboard" class="welcome hidden">
      <h1>STUDENT DASHBOARD</h1>
      <p>Welcome, <strong id="studentName"></strong>!</p>
      <p>Your registered course:</p>
      <h2 id="studentCourse" style="color:#e7c66e"></h2>
      <p>Your account is connected successfully.</p>
      <p>Online assessments will be available here when the exam module is configured.</p>
      <button id="logoutButton" class="logout" type="button">LOG OUT</button>
    </section>
  </main>

  <script>
    // Replace these two placeholders with your Supabase project details.
    const SUPABASE_URL = "PASTE_YOUR_PROJECT_URL_HERE";
    const SUPABASE_PUBLISHABLE_KEY = "PASTE_YOUR_PUBLISHABLE_KEY_HERE";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const authSection = document.getElementById("authSection");
    const dashboard = document.getElementById("dashboard");
    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");
    const loginTab = document.getElementById("loginTab");
    const registerTab = document.getElementById("registerTab");
    const message = document.getElementById("message");

    function showMessage(text, isError = false) {
      message.textContent = text;
      message.style.color = isError ? "#ff9999" : "#b9efc5";
    }

    function showLogin() {
      loginForm.classList.remove("hidden");
      registerForm.classList.add("hidden");
      loginTab.classList.add("active");
      registerTab.classList.remove("active");
      showMessage("");
    }

    function showRegister() {
      registerForm.classList.remove("hidden");
      loginForm.classList.add("hidden");
      registerTab.classList.add("active");
      loginTab.classList.remove("active");
      showMessage("");
    }

    loginTab.addEventListener("click", showLogin);
    registerTab.addEventListener("click", showRegister);

    function readableError(error) {
      const text = error?.message || "Something went wrong.";
      if (text.toLowerCase().includes("invalid login credentials")) {
        return "Email or password is incorrect.";
      }
      if (text.toLowerCase().includes("email rate limit")) {
        return "Too many email attempts. Please wait before trying again.";
      }
      return text;
    }

    async function loadDashboard(user) {
      const { data: profile, error } = await client
        .from("profiles")
        .select("full_name, course_id, role")
        .eq("id", user.id)
        .single();

      if (error || !profile) {
        showMessage(
          "Your account exists, but the profile could not be loaded. Please contact the administrator.",
          true
        );
        return;
      }

      if (profile.role === "admin") {
        showMessage("Admin account detected. Use the configured admin portal.", true);
        return;
      }

      let courseName = "Course not assigned";

      if (profile.course_id) {
        const { data: course, error: courseError } = await client
          .from("courses")
          .select("course_name")
          .eq("id", profile.course_id)
          .single();

        if (!courseError && course) {
          courseName = course.course_name;
        }
      }

      document.getElementById("studentName").textContent =
        profile.full_name || user.email || "Student";

      document.getElementById("studentCourse").textContent = courseName;

      authSection.classList.add("hidden");
      dashboard.classList.remove("hidden");
    }

    loginForm.addEventListener("submit", async function(event) {
      event.preventDefault();
      showMessage("Signing in...");

      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;

      const { data, error } = await client.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        showMessage(readableError(error), true);
        return;
      }

      await loadDashboard(data.user);
    });

    registerForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      const fullName = document.getElementById("fullName").value.trim();
      const email = document.getElementById("registerEmail").value.trim();
      const course = document.getElementById("course").value;
      const password = document.getElementById("registerPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (!fullName || !course) {
        showMessage("Please complete all required fields.", true);
        return;
      }

      if (password.length < 8) {
        showMessage("Password must be at least 8 characters.", true);
        return;
      }

      if (password !== confirmPassword) {
        showMessage("Passwords do not match.", true);
        return;
      }

      showMessage("Creating your account...");

      const { data, error } = await client.auth.signUp({
        email,
        password,
        options: {
          data: {
            full_name: fullName,
            course: course
          }
        }
      });

      if (error) {
        showMessage(readableError(error), true);
        return;
      }

      if (data.session && data.user) {
        await loadDashboard(data.user);
      } else {
        showMessage(
          "Registration received! Check your email for a confirmation link, if email confirmation is enabled. After confirmation, return and log in."
        );
      }
    });

    document.getElementById("logoutButton").addEventListener("click", async () => {
      await client.auth.signOut();
      dashboard.classList.add("hidden");
      authSection.classList.remove("hidden");
      showLogin();
    });

    async function restoreSession() {
      const { data, error } = await client.auth.getSession();
      if (!error && data.session) {
        await loadDashboard(data.session.user);
      }
    }

    if (
      SUPABASE_URL === "PASTE_YOUR_PROJECT_URL_HERE" ||
      SUPABASE_PUBLISHABLE_KEY === "PASTE_YOUR_PUBLISHABLE_KEY_HERE"
    ) {
      showMessage("Setup required: add your Supabase Project URL and Publishable Key in the code.", true);
    } else {
      restoreSession();
    }
  </script>
</body>
</html>
