<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>S.G Institute of Learning</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #07111f;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h1 {
      color: #d4af37;
      font-size: 28px;
      letter-spacing: 1px;
    }

    .logo p {
      color: #bfc7d5;
      margin-top: 7px;
    }

    .card {
      background: #101c2d;
      border: 1px solid #263952;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 15px 40px rgba(0,0,0,.35);
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 22px;
    }

    .tabs button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #18283d;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .tabs button.active {
      background: #d4af37;
      color: #07111f;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 13px;
      border-radius: 10px;
      border: 1px solid #344961;
      background: #0b1727;
      color: white;
      outline: none;
    }

    input:focus {
      border-color: #d4af37;
    }

    .main-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #d4af37;
      color: #07111f;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-top: 5px;
    }

    .main-btn:disabled {
      opacity: .6;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      min-height: 20px;
      color: #d4af37;
      font-size: 14px;
    }

    .hidden {
      display: none;
    }

    .welcome {
      text-align: center;
    }

    .welcome h2 {
      color: #d4af37;
    }

    .logout {
      margin-top: 20px;
      background: #b83b3b;
      color: white;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">
    <h1>S.G INSTITUTE OF LEARNING</h1>
    <p>Online Examination Portal</p>
  </div>

  <div class="card">

    <!-- LOGIN / REGISTER -->
    <div id="authSection">

      <div class="tabs">
        <button id="loginTab" class="active" onclick="showLogin()">
          LOGIN
        </button>

        <button id="registerTab" onclick="showRegister()">
          REGISTER
        </button>
      </div>

      <!-- LOGIN -->
      <div id="loginForm">

        <h2>Student Login</h2>

        <input
          type="text"
          id="loginStudentId"
          placeholder="Student ID"
          autocomplete="username"
        >

        <input
          type="password"
          id="loginPassword"
          placeholder="Password"
          autocomplete="current-password"
        >

        <button class="main-btn" onclick="loginStudent()">
          LOGIN
        </button>

        <div id="loginMessage" class="message"></div>

      </div>


      <!-- REGISTER -->
      <div id="registerForm" class="hidden">

        <h2>Student Registration</h2>

        <input
          type="text"
          id="studentName"
          placeholder="Student Name"
        >

        <input
          type="text"
          id="studentId"
          placeholder="Student ID"
        >

        <input
          type="password"
          id="password"
          placeholder="Password"
        >

        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm Password"
        >

        <button class="main-btn" onclick="registerStudent()">
          CREATE ACCOUNT
        </button>

        <div id="registerMessage" class="message"></div>

      </div>

    </div>


    <!-- LOGGED IN -->
    <div id="welcomeSection" class="welcome hidden">

      <h2>Welcome!</h2>

      <p id="welcomeText"></p>

      <button class="main-btn" onclick="startTest()">
        START TODAY'S TEST
      </button>

      <button class="main-btn logout" onclick="logoutStudent()">
        LOGOUT
      </button>

    </div>

  </div>

</div>


<script>

  /*
   =====================================================
   SUPABASE CONFIGURATION
   =====================================================
  */

  const SUPABASE_URL = "https://ywsedmdfacwgvskkiuzy.supabase.co";

  const SUPABASE_KEY = "sb_publishable_LSM3kXWUKw9K7OEroiabkw_zVTdAoEM";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /*
   =====================================================
   LOGIN / REGISTER TABS
   =====================================================
  */

  function showLogin() {

    document.getElementById("loginForm")
      .classList.remove("hidden");

    document.getElementById("registerForm")
      .classList.add("hidden");

    document.getElementById("loginTab")
      .classList.add("active");

    document.getElementById("registerTab")
      .classList.remove("active");
  }


  function showRegister() {

    document.getElementById("loginForm")
      .classList.add("hidden");

    document.getElementById("registerForm")
      .classList.remove("hidden");

    document.getElementById("loginTab")
      .classList.remove("active");

    document.getElementById("registerTab")
      .classList.add("active");
  }


  /*
   =====================================================
   STUDENT REGISTRATION
   =====================================================
  */

  async function registerStudent() {

    const name =
      document.getElementById("studentName").value.trim();

    const studentId =
      document.getElementById("studentId").value.trim();

    const password =
      document.getElementById("password").value;

    const confirmPassword =
      document.getElementById("confirmPassword").value;

    const message =
      document.getElementById("registerMessage");


    message.textContent = "";


    if (!name || !studentId || !password || !confirmPassword) {

      message.textContent =
        "Please fill all fields.";

      return;
    }


    if (password !== confirmPassword) {

      message.textContent =
        "Passwords do not match.";

      return;
    }


    if (password.length < 6) {

      message.textContent =
        "Password must contain at least 6 characters.";

      return;
    }


    /*
      Supabase Auth uses an internal email.
      Students only see/use Student ID.
    */

    const email =
      studentId.toLowerCase() +
      "@student.sginstitute.com";


    const { data, error } =
      await supabaseClient.auth.signUp({

        email: email,

        password: password,

        options: {

          data: {
            full_name: name,
            student_id: studentId
          }

        }

      });


    if (error) {

      message.textContent =
        error.message;

      return;
    }


    message.textContent =
      "Registration successful! You can now login.";

    document.getElementById("studentName").value = "";
    document.getElementById("studentId").value = "";
    document.getElementById("password").value = "";
    document.getElementById("confirmPassword").value = "";


    setTimeout(() => {

      showLogin();

    }, 1500);

  }


  /*
   =====================================================
   STUDENT LOGIN
   =====================================================
  */

  async function loginStudent() {

    const studentId =
      document.getElementById("loginStudentId")
        .value.trim();

    const password =
      document.getElementById("loginPassword")
        .value;

    const message =
      document.getElementById("loginMessage");


    message.textContent = "";


    if (!studentId || !password) {

      message.textContent =
        "Enter Student ID and Password.";

      return;
    }


    const email =
      studentId.toLowerCase() +
      "@student.sginstitute.com";


    const { data, error } =
      await supabaseClient.auth.signInWithPassword({

        email: email,

        password: password

      });


    if (error) {

      message.textContent =
        "Invalid Student ID or Password.";

      return;
    }


    message.textContent =
      "Login successful!";


    await loadStudent();

  }


  /*
   =====================================================
   LOAD STUDENT
   =====================================================
  */

  async function loadStudent() {

    const {
      data: { user }
    } = await supabaseClient.auth.getUser();


    if (!user) return;


    const { data: profile } =
      await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id", user.id)
        .single();


    document.getElementById("authSection")
      .classList.add("hidden");

    document.getElementById("welcomeSection")
      .classList.remove("hidden");


    if (profile) {

      document.getElementById("welcomeText")
        .textContent =
        "Welcome, " +
        profile.full_name +
        " (" +
        profile.student_id +
        ")";

    }

  }


  /*
   =====================================================
   LOGOUT
   =====================================================
  */

  async function logoutStudent() {

    await supabaseClient.auth.signOut();

    location.reload();

  }


  /*
   =====================================================
   START TEST
   =====================================================
  */

  function startTest() {

    alert(
      "Today's test system will be connected in the next step."
    );

  }


  /*
   =====================================================
   CHECK EXISTING LOGIN
   =====================================================
  */

  window.addEventListener("load", async () => {

    const {
      data: { session }
    } = await supabaseClient.auth.getSession();


    if (session) {

      await loadStudent();

    }

  });

</script>

</body>
</html>
